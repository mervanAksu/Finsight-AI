# Portlar yalnızca bu bilgisayara (127.0.0.1) açılır; aynı ağdaki başka cihazlar erişemez.
services:
  db:
    # pgvector imajı Aşama 4 (veritabanında vektör araması) içindir; şu an vektörler ikili
    # sütunda saklanır ve benzerlik numpy ile hesaplanır, uzantı kullanılmaz.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: finsight
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env dosyasında tanımlanmalı}
      POSTGRES_DB: finsight
    # Veritabanı portu dışarı AÇILMAZ: api servisi db'ye Docker ağı üzerinden (db:5432) bağlanır.
    # psql / DBeaver ile bağlanmak gerekirse geçici olarak açın (yalnızca bu bilgisayara):
    # ports:
    #   - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finsight"]
      interval: 5s
      retries: 10

  api:
    # Kök Dockerfile: arayüz derlenir ve http://localhost:8000 adresinden API ile birlikte sunulur.
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_ML: ${INSTALL_ML:-0}
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://finsight:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env dosyasında tanımlanmalı}@db:5432/finsight
      SEC_CACHE_DIR: /app/.sec_cache
      FINSIGHT_DOCUMENTS_DIR: /app/.sec_cache/documents
      HF_HOME: /app/.hf_cache
    ports:
      - "127.0.0.1:8000:8000"   # http://localhost:8000
    volumes:
      - seccache:/app/.sec_cache
      - hfcache:/app/.hf_cache
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  seccache:
  hfcache:
