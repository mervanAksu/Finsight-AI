services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: finsight
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finsight_dev}
      POSTGRES_DB: finsight
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finsight"]
      interval: 5s
      retries: 10

  api:
    # Kök Dockerfile: arayüz derlenir ve http://localhost:8000 adresinden API ile birlikte sunulur.
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_ML: ${INSTALL_ML:-0}
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://finsight:${POSTGRES_PASSWORD:-finsight_dev}@db:5432/finsight
      SEC_CACHE_DIR: /app/.sec_cache
      FINSIGHT_DOCUMENTS_DIR: /app/.sec_cache/documents
      HF_HOME: /app/.hf_cache
    ports:
      - "8000:8000"
    volumes:
      - seccache:/app/.sec_cache
      - hfcache:/app/.hf_cache
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  seccache:
  hfcache:
