<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="FinSight AI: SEC 10-K, 10-Q ve 8-K raporlarından finansal analiz, risk ve ton incelemesi, kaynaklı soru-cevap. Yatırım tavsiyesi değildir." />
    <meta name="color-scheme" content="light dark" />
    <title>FinSight AI</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232456d6'/%3E%3Cpath d='M9 22V15M16 22V10M23 22v-5' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E" />
    <script>
      // Tema, ilk boyamadan önce uygulanır (yanıp sönmeyi önler).
      (function () {
        var theme = null;
        try { theme = window.localStorage.getItem("finsight.theme"); } catch (e) { theme = null; }
        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", theme);
        var lang = null;
        try { lang = window.localStorage.getItem("finsight.lang"); } catch (e) { lang = null; }
        if (lang === "en") document.documentElement.setAttribute("lang", "en");
      })();
    </script>
    <link rel="stylesheet" href="./assets/app.css" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>FinSight AI çalışmak için JavaScript gerektirir.</noscript>
    <script type="module" src="./assets/app.js"></script>
  </body>
</html>
